name: Install and runtime
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22.12.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run check:s2
      - run: npm run check:setup
      - if: runner.os == 'Linux' && matrix.node == '24'
        run: npm audit --audit-level=critical --registry=https://registry.npmjs.org
